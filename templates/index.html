<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibes - Nhắn tin phong cách Cyberpunk</title>
    <!-- Nhóm font chữ và Socket.io -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-deep: #05050a;
            --bg-panel: #0b0b16;
            --neon-blue: #00f3ff;
            --neon-green: #00ff66;
            --neon-pink: #ff0055;
            --text-main: #e0e0e0;
            --text-dim: #707090;
            --border-neon: rgba(0, 243, 255, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-deep); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        /* Hiệu ứng neon glow */
        .neon-text { font-family: 'Orbitron', sans-serif; text-shadow: 0 0 10px var(--neon-blue), 0 0 20px rgba(0, 243, 255, 0.5); }
        .neon-box { border: 1px solid var(--border-neon); box-shadow: 0 0 15px rgba(0, 243, 255, 0.15); }

        /* Màn hình Đăng nhập / Đăng ký */
        #auth-screen {
            width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0b0b1c 0%, #05050a 100%);
            position: absolute; z-index: 100;
        }
        .auth-card {
            background: var(--bg-panel); padding: 40px; border-radius: 12px; width: 380px; text-align: center;
        }
        .auth-card h1 { color: var(--neon-blue); margin-bottom: 24px; font-size: 28px; letter-spacing: 2px; }
        .auth-input {
            width: 100%; padding: 12px 16px; margin-bottom: 16px; background: #05050a; border: 1px solid var(--border-neon);
            border-radius: 6px; color: #fff; font-size: 14px; outline: none; transition: 0.3s;
        }
        .auth-input:focus { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
        .auth-btn {
            width: 100%; padding: 12px; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green);
            border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-bottom: 12px;
        }
        .auth-btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 15px var(--neon-green); }
        .switch-auth { color: var(--text-dim); font-size: 13px; cursor: pointer; }
        .switch-auth span { color: var(--neon-blue); text-decoration: underline; }

        /* Màn hình Chat chính */
        #chat-screen { width: 100vw; height: 100vh; display: none; flex-direction: row; }
        
        /* Sidebar danh sách chat */
        .sidebar { width: 300px; background: var(--bg-panel); border-right: 1px solid var(--border-neon); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-neon); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h2 { color: var(--neon-blue); font-size: 20px; }
        .logout-btn { background: none; border: none; color: var(--neon-pink); cursor: pointer; font-size: 13px; }
        
        .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item {
            padding: 12px 15px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02);
        }
        .chat-item:hover, .chat-item.active { background: rgba(0, 243, 255, 0.08); border-left: 3px solid var(--neon-blue); }
        .online-dot { width: 8px; height: 8px; background: var(--neon-green); border-radius: 50%; box-shadow: 0 0 5px var(--neon-green); }

        /* Khung chat bên phải */
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-deep); }
        .chat-header { padding: 15px 25px; background: var(--bg-panel); border-bottom: 1px solid var(--border-neon); display: flex; align-items: center; }
        .chat-header h3 { color: var(--neon-green); font-size: 18px; }

        .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 65%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; position: relative; word-break: break-word; }
        .message.incoming { background: #121224; border: 1px solid var(--border-neon); align-self: flex-start; color: #fff; }
        .message.outgoing { background: rgba(0, 255, 102, 0.1); border: 1px solid rgba(0, 255, 102, 0.3); align-self: flex-end; color: #fff; }
        .message .time { font-size: 10px; color: var(--text-dim); margin-top: 4px; text-align: right; }
        .message.deleted { font-style: italic; color: var(--text-dim); background: #080810; border: 1px dashed var(--text-dim); }

        /* Menu hành động tin nhắn (Thu hồi / Xóa) */
        .msg-actions { display: none; position: absolute; right: 5px; top: 5px; background: #000; border: 1px solid var(--neon-blue); border-radius: 4px; }
        .message:hover .msg-actions { display: block; }
        .msg-actions button { background: none; border: none; color: #fff; padding: 3px 8px; font-size: 11px; cursor: pointer; }
        .msg-actions button:hover { color: var(--neon-pink); }

        /* Thanh nhập tin nhắn */
        .chat-input-area { padding: 15px 20px; background: var(--bg-panel); border-top: 1px solid var(--border-neon); display: flex; align-items: center; gap: 12px; }
        .chat-input-area input[type="text"] {
            flex: 1; background: #05050a; border: 1px solid var(--border-neon); padding: 12px 15px; border-radius: 6px; color: #fff; outline: none;
        }
        .chat-input-area input[type="text"]:focus { border-color: var(--neon-blue); }
        .file-upload-label { cursor: pointer; color: var(--neon-blue); font-size: 20px; transition: 0.2s; }
        .file-upload-label:hover { color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }
        .send-btn { background: transparent; border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .send-btn:hover { background: var(--neon-blue); color: #000; box-shadow: 0 0 12px var(--neon-blue); }
    </style>
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen">
        <div class="auth-card neon-box">
            <h1 class="neon-text">VIBES</h1>
            <input type="text" id="username" class="auth-input" placeholder="Tên tài khoản...">
            <input type="password" id="password" class="auth-input" placeholder="Mật khẩu bảo vệ...">
            <button id="auth-submit-btn" class="auth-btn" onclick="handleAuth()">ĐĂNG NHẬP</button>
            <p class="switch-auth" onclick="toggleAuthMode()"><span id="switch-text">Chưa có tài khoản? Đăng ký ngay</span></p>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH (CHAT) -->
    <div id="chat-screen">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2 class="neon-text" id="current-user-display">Vibes</h2>
                <button class="logout-btn" onclick="logout()">Đăng xuất</button>
            </div>
            <div class="chat-list" id="chat-list">
                <!-- Danh sách nhóm & bạn bè sẽ load tự động ở đây -->
                <div class="chat-item active" onclick="selectChat('Global Group', this)">
                    <span>💬 Nhóm Chung (Global)</span>
                    <div class="online-dot"></div>
                </div>
            </div>
        </div>

        <!-- Khung chat -->
        <div class="chat-main">
            <div class="chat-header">
                <h3 id="active-chat-title">Nhóm Chung (Global)</h3>
            </div>
            <div class="messages-container" id="messages-container">
                <!-- Tin nhắn hiển thị ở đây -->
            </div>
            <div class="chat-input-area">
                <label for="file-input" class="file-upload-label" title="Gửi ảnh hoặc tệp">📎</label>
                <input type="file" id="file-input" style="display: none;" onchange="uploadAndSendFile(this)">
                <input type="text" id="message-input" placeholder="Nhập tin nhắn phát sóng..." onkeypress="handleKeyPress(event)">
                <button class="send-btn" onclick="sendMessage()">GỬI</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = localStorage.getItem('vibes_user') || null;
        let activeTarget = 'Global Group';
        let isRegisterMode = false;
        const socket = io();

        // Kiểm tra trạng thái đăng nhập khi mở trang
        window.onload = () => {
            if (currentUser) {
                showChatScreen();
            }
        };

        function toggleAuthMode() {
            isRegisterMode = !isRegisterMode;
            const btn = document.getElementById('auth-submit-btn');
            const switchTxt = document.getElementById('switch-text');
            if (isRegisterMode) {
                btn.innerText = 'ĐĂNG KÝ';
                switchTxt.innerText = 'Đã có tài khoản? Đăng nhập';
            } else {
                btn.innerText = 'ĐĂNG NHẬP';
                switchTxt.innerText = 'Chưa có tài khoản? Đăng ký ngay';
            }
        }

        async function handleAuth() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) { alert('Vui lòng điền đầy đủ thông tin!'); return; }

            const endpoint = isRegisterMode ? '/api/register' : '/api/login';
            const res = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();

            if (data.success) {
                if (isRegisterMode) {
                    alert('Đăng ký thành công! Hãy đăng nhập.');
                    toggleAuthMode();
                } else {
                    currentUser = data.username;
                    localStorage.setItem('vibes_user', currentUser);
                    showChatScreen();
                }
            } else {
                alert(data.message);
            }
        }

        function logout() {
            localStorage.removeItem('vibes_user');
            location.reload();
        }

        function showChatScreen() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
            document.getElementById('current-user-display').innerText = '@' + currentUser;
            loadUsers();
            loadMessages();
            setInterval(loadUsers, 5000); // Tự động cập nhật danh sách user
        }

        async function loadUsers() {
            const res = await fetch('/api/users');
            const users = await res.json();
            const list = document.getElementById('chat-list');
            
            // Giữ lại Nhóm Chung đầu tiên
            let html = `<div class="chat-item ${activeTarget === 'Global Group' ? 'active' : ''}" onclick="selectChat('Global Group', this)">
                            <span>💬 Nhóm Chung (Global)</span>
                            <div class="online-dot"></div>
                        </div>`;
            
            users.forEach(u => {
                if (u !== currentUser) {
                    html += `<div class="chat-item ${activeTarget === u ? 'active' : ''}" onclick="selectChat('${u}', this)">
                                <span>👤 @${u}</span>
                                <div class="online-dot"></div>
                            </div>`;
                }
            });
            list.innerHTML = html;
        }

        function selectChat(target, element) {
            activeTarget = target;
            document.getElementById('active-chat-title').innerText = target === 'Global Group' ? 'Nhóm Chung (Global)' : 'Chat riêng với @' + target;
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            loadMessages();
        }

        async function loadMessages() {
            const res = await fetch(`/api/messages/${activeTarget}?user=${currentUser}`);
            const messages = await res.json();
            const container = document.getElementById('messages-container');
            container.innerHTML = '';

            messages.forEach(m => appendMessage(m));
            container.scrollTop = container.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            socket.emit('send_message', {
                sender: currentUser,
                receiver: activeTarget,
                content: text,
                timestamp: timeStr
            });
            input.value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        async function uploadAndSendFile(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch('/api/upload', { method: 'POST', body: formData });
            const data = await res.json();

            if (data.success) {
                const timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const contentHtml = data.file_type === 'image' 
                    ? `<img src="${data.url}" style="max-width:200px; border-radius:6px; display:block; margin-bottom:5px;">` 
                    : `<a href="${data.url}" target="_blank" style="color:var(--neon-blue);">📁 Tệp: ${data.filename}</a>`;

                socket.emit('send_message', {
                    sender: currentUser,
                    receiver: activeTarget,
                    content: contentHtml,
                    timestamp: timeStr
                });
            } else {
                alert(data.message);
            }
            input.value = '';
        }

        function unsendMsg(id) {
            socket.emit('unsend_message', { id: id });
        }

        // Lắng nghe Socket Real-time
        socket.on('receive_message', (msg) => {
            if (msg.receiver === activeTarget || msg.sender === currentUser || msg.receiver === 'Global Group' && activeTarget === 'Global Group') {
                appendMessage(msg);
                const container = document.getElementById('messages-container');
                container.scrollTop = container.scrollHeight;
            }
        });

        socket.on('message_unsent', (data) => {
            const msgEl = document.getElementById(`msg-${data.id}`);
            if (msgEl) {
                msgEl.className = 'message deleted';
                msgEl.innerHTML = '[Tin nhắn đã bị thu hồi]';
            }
        });

        function appendMessage(m) {
            const container = document.getElementById('messages-container');
            const isOutgoing = m.sender === currentUser;
            const div = document.createElement('div');
            div.id = `msg-${m.id}`;
            div.className = `message ${isOutgoing ? 'outgoing' : 'incoming'} ${m.is_deleted ? 'deleted' : ''}`;

            let bodyContent = m.is_deleted ? '[Tin nhắn đã bị thu hồi]' : m.content;
            
            let actionHtml = '';
            if (isOutgoing && !m.is_deleted) {
                actionHtml = `<div class="msg-actions"><button onclick="unsendMsg(${m.id})">Thu hồi</button></div>`;
            }

            div.innerHTML = `
                ${!isOutgoing ? `<b style="color:var(--neon-blue); font-size:11px; display:block; margin-bottom:3px;">@${m.sender}</b>` : ''}
                <div>${bodyContent}</div>
                <div class="time">${m.timestamp}</div>
                ${actionHtml}
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
